name: Update Profile README

# Define cuándo se ejecutará este flujo
on:
  schedule:
    - cron: '0 0 * * *' #  00:00 UTC cada día
  workflow_dispatch: # manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANTE: Permite al workflow editar y guardar cambios en tus archivos
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Ejecutar script de actualización
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python update_readme.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No hay cambios para hacer commit."
          else
            git commit -m 'Auto-update: Tecnologías y Proyectos' || exit 0
            git push
          fi